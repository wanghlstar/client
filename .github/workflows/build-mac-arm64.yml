name: Build Mac arm64

on:
  workflow_dispatch:   # 在 Actions 页面手动触发
  push:
    branches: [custom-v2.1.3-nodock] # push 到本分支自动触发

jobs:
  build-mac:
    runs-on: macos-latest   # 当前为 arm64 runner；如需固定可改为 macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build go client (darwin sidecar)
        run: make build-client
        working-directory: go-client

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: interface

      - name: Build mac app (arm64 dmg)
        run: npm run build:mac
        working-directory: interface

      - name: Diagnose build output
        if: always()
        run: |
          echo "=== dist_electron tree ==="
          find interface/dist_electron -type f 2>/dev/null | head -50
          echo "=== any dmg/blockmap (excl node_modules/.git) ==="
          find . \( -name "*.dmg" -o -name "*.blockmap" \) -not -path "*/node_modules/*" -not -path "./.git/*" 2>/dev/null | head -20
          echo "=== dist_electron size ==="
          du -sh interface/dist_electron 2>/dev/null || echo "dist_electron NOT FOUND"

      - uses: actions/upload-artifact@v4
        with:
          name: JumpServer-Client-mac-arm64
          path: |
            interface/dist_electron/**/*.dmg
          if-no-files-found: error
